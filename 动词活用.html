<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日语词汇语法练习</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 隐藏滚动条 */
        ::-webkit-scrollbar {
            display: none;
        }
        /* 底部弹窗动画 */
        .bottom-sheet-enter {
            transform: translateY(100%);
        }
        .bottom-sheet-active {
            transform: translateY(0);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        /* 简单的按压动画 */
        .btn-press:active {
            transform: scale(0.97);
        }
        /* 手机外壳自适应缩放 */
        @media (max-width: 500px) {
            #phone-wrapper {
                transform: scale(0.85);
                transform-origin: top center;
            }
        }
    </style>
</head>
<body class="bg-gray-200 min-h-screen flex items-center justify-center py-10 font-sans">

    <!-- iPhone 14 Pro Max 外壳 (约 430x932 比例) -->
    <div id="phone-wrapper" class="relative w-[430px] h-[900px] bg-black rounded-[55px] shadow-2xl p-[14px] flex-shrink-0">
        
        <!-- 屏幕内容区域 (含圆角和超出隐藏) -->
        <div class="relative w-full h-full bg-[#f9fafb] rounded-[45px] overflow-hidden flex flex-col">
            
            <!-- 灵动岛 (Dynamic Island) -->
            <div class="absolute top-2 left-1/2 -translate-x-1/2 w-[120px] h-[35px] bg-black rounded-full z-50"></div>
            
            <!-- 顶部状态栏占位 (时间、信号、电量等，简单模拟) -->
            <div class="h-12 w-full flex justify-between items-center px-8 text-xs font-semibold z-40 relative pt-2">
                <span>9:41</span>
                <div class="flex space-x-2 items-center">
                    <!-- 信号图标简易绘制 -->
                    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M2 22h20V2L2 22z"/></svg>
                    <!-- 电池图标简易绘制 -->
                    <div class="w-6 h-3 border border-black rounded-sm p-[1px] relative">
                        <div class="w-full h-full bg-black rounded-[1px]"></div>
                        <div class="absolute -right-1 top-1 w-1 h-1 bg-black rounded-r-sm"></div>
                    </div>
                </div>
            </div>

            <!-- 主应用界面区域 -->
            <div id="app-content" class="flex-1 flex flex-col px-5 pt-2 pb-8 overflow-y-auto relative">
                
                <!-- 进度条 & 题号 -->
                <div class="flex justify-between items-center mb-6">
                    <!-- 进度条容器 -->
                    <div class="w-[80%] h-1.5 bg-gray-200 rounded-full overflow-hidden">
                        <div id="progress-bar" class="h-full bg-blue-600 transition-all duration-300 w-0"></div>
                    </div>
                    <span id="progress-text" class="text-sm font-medium text-gray-500">1/5</span>
                </div>

                <!-- 答题区域 -->
                <div id="question-container" class="flex-col gap-4 flex transition-opacity duration-300">
                    
                    <!-- 词汇卡片 -->
                    <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 relative">
                        <div class="text-gray-500 text-sm mb-1" id="word-furigana">おぼえる</div>
                        <div class="text-3xl font-bold mb-2 text-gray-800" id="word-kanji">覚える</div>
                        <div class="text-gray-500 text-sm" id="word-meaning">记住，学会</div>
                        <!-- 发音按钮 -->
                        <button class="absolute top-5 right-5 text-blue-600 btn-press bg-blue-50 p-2 rounded-full" onclick="playAudio()">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
                            </svg>
                        </button>
                    </div>

                    <!-- 题目卡片 -->
                    <div class="bg-[#f0f4ff] rounded-2xl p-5 border border-blue-100/50 mt-1">
                        <div class="text-xl font-medium leading-relaxed text-gray-800 mb-4 tracking-wide" id="question-text">
                            <!-- 题目内容由 JS 注入 -->
                        </div>
                        <div class="flex items-start text-sm text-gray-500">
                            <div class="w-5 h-5 rounded-full bg-blue-100 text-blue-500 flex items-center justify-center mr-2 flex-shrink-0 mt-0.5 text-xs font-bold">文</div>
                            <span id="question-translation">请记住电话号码。</span>
                        </div>
                    </div>

                    <!-- 选项区域 -->
                    <div class="grid grid-cols-2 gap-3 mt-4" id="options-container">
                        <!-- 选项由 JS 注入 -->
                    </div>
                </div>

                <!-- 结算区域 (初始隐藏) -->
                <div id="result-container" class="hidden flex-col items-center justify-center h-full text-center">
                    <div class="text-5xl mb-4">?</div>
                    <h2 class="text-2xl font-bold text-gray-800 mb-2">练习完成！</h2>
                    <p class="text-gray-500 mb-8">你已经完成了所有测试题目</p>
                    <button onclick="restartApp()" class="bg-blue-600 text-white px-8 py-3 rounded-full font-bold btn-press w-full max-w-[200px] shadow-lg shadow-blue-200">重新开始</button>
                </div>

            </div>

            <!-- 底部反馈弹窗 -->
            <div id="bottom-sheet" class="absolute bottom-0 left-0 w-full rounded-t-[30px] p-6 shadow-[0_-10px_40px_rgba(0,0,0,0.1)] z-40 bottom-sheet-enter bg-white">
                <div class="flex flex-col h-full">
                    <h3 id="feedback-title" class="text-xl font-bold mb-2">正确答案：覚えて</h3>
                    <p id="feedback-desc" class="text-gray-600 text-sm leading-relaxed mb-6">
                        「ください」前面通常接动词て形，表示“请做某事”。「覚える」变成て形是「覚えて」。
                    </p>
                    <button onclick="nextQuestion()" id="next-btn" class="w-full py-4 rounded-xl font-bold text-white text-lg btn-press">
                        继续
                    </button>
                    <!-- 适配 iPhone 底部安全区 -->
                    <div class="h-6 w-full"></div>
                </div>
            </div>

            <!-- iPhone 底部 Home 指示条 -->
            <div class="absolute bottom-2 left-1/2 -translate-x-1/2 w-[140px] h-[5px] bg-gray-300 rounded-full z-50"></div>

        </div>
    </div>

    <script>
        // 题目数据准备 (5道题)
        const questionsData = [
            {
                word: "覚える", furigana: "おぼえる", meaning: "记住，学会",
                qText: "<ruby>電話<rt>でんわ</rt></ruby><ruby>番号<rt>ばんごう</rt></ruby>を____ください。",
                translation: "请记住电话号码。",
                options: ["覚えた", "覚えない", "覚える", "覚えて"],
                correctIndex: 3,
                explanation: "「ください」前面通常接动词て形，表示请求对方“请做某事”。「覚える」是二类动词（一段动词），去「る」加「て」形成「覚えて」。"
            },
            {
                word: "借りる", furigana: "かりる", meaning: "借入，借用",
                qText: "お<ruby>金<rt>かね</rt></ruby>が<ruby>足<rt>た</rt></ruby>りなければ<ruby>友達<rt>ともだち</rt></ruby>に____いい。",
                translation: "钱不够的话，向朋友借就好。",
                options: ["借りろ", "借りる", "借りれば", "借りた"],
                correctIndex: 2,
                explanation: "这里需要用条件形。线索是后面的「いい」，构成「?ばいい」，表示“……就好”。「借りる」是一段动词，去「る」加「れば」，变成「借りれば」。"
            },
            {
                word: "押す", furigana: "おす", meaning: "推，按，压",
                qText: "ボタンを____、ドアを<ruby>開<rt>あ</rt></ruby>けて。",
                translation: "按下按钮，然后打开门。",
                options: ["押して", "押せば", "押した", "押します"],
                correctIndex: 0,
                explanation: "这里要表示动作的先后顺序，“按下按钮”和“开门”两个动作连接起来，所以用て形。「押す」变て形是「押して」。"
            },
            {
                word: "使う", furigana: "つかう", meaning: "使用",
                qText: "ペンを____、<ruby>名前<rt>なまえ</rt></ruby>を<ruby>書<rt>か</rt></ruby>いてください。",
                translation: "请用笔写名字。",
                options: ["使わなくて", "使った", "使います", "使って"],
                correctIndex: 3,
                explanation: "这里表示使用工具或手段，后面接着另一个动作「書いてください」，所以要用て形连接。「使う」的て形是发生促音变的「使って」。"
            },
            {
                word: "消す", furigana: "けす", meaning: "关掉，熄灭",
                qText: "テレビを____ください。",
                translation: "请关掉电视。",
                options: ["消して", "消せ", "消した", "消します"],
                correctIndex: 0,
                explanation: "同第一题，表示请求的「ください」前接て形。「消す」以「す」结尾，变て形为「消して」。"
            }
        ];

        let currentIndex = 0;
        let isAnswered = false;

        // 获取 DOM 元素
        const dom = {
            progressText: document.getElementById('progress-text'),
            progressBar: document.getElementById('progress-bar'),
            wordFurigana: document.getElementById('word-furigana'),
            wordKanji: document.getElementById('word-kanji'),
            wordMeaning: document.getElementById('word-meaning'),
            questionText: document.getElementById('question-text'),
            questionTranslation: document.getElementById('question-translation'),
            optionsContainer: document.getElementById('options-container'),
            bottomSheet: document.getElementById('bottom-sheet'),
            feedbackTitle: document.getElementById('feedback-title'),
            feedbackDesc: document.getElementById('feedback-desc'),
            nextBtn: document.getElementById('next-btn'),
            questionContainer: document.getElementById('question-container'),
            resultContainer: document.getElementById('result-container')
        };

        // 初始化/渲染题目
        function renderQuestion() {
            if (currentIndex >= questionsData.length) {
                showResult();
                return;
            }

            const q = questionsData[currentIndex];
            isAnswered = false;

            // 更新进度
            dom.progressText.innerText = `${currentIndex + 1}/${questionsData.length}`;
            dom.progressBar.style.width = `${((currentIndex) / questionsData.length) * 100}%`;

            // 更新词汇与题目
            dom.wordFurigana.innerText = q.furigana;
            dom.wordKanji.innerText = q.word;
            dom.wordMeaning.innerText = q.meaning;
            dom.questionText.innerHTML = q.qText;
            dom.questionTranslation.innerText = q.translation;

            // 渲染选项
            dom.optionsContainer.innerHTML = '';
            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = `bg-white text-gray-800 font-medium py-4 px-2 rounded-xl shadow-sm border-2 border-transparent text-center hover:bg-gray-50 transition-colors btn-press`;
                btn.innerText = opt;
                btn.onclick = () => handleOptionClick(index, btn);
                dom.optionsContainer.appendChild(btn);
            });

            // 隐藏底部弹窗
            hideBottomSheet();
        }

        // 处理用户点击选项
        function handleOptionClick(selectedIndex, btnElement) {
            if (isAnswered) return; // 锁定，防止重复点击
            isAnswered = true;

            const q = questionsData[currentIndex];
            const isCorrect = selectedIndex === q.correctIndex;

            // 获取所有按钮，禁用它们并降低透明度（被选中的除外）
            const allBtns = dom.optionsContainer.querySelectorAll('button');
            allBtns.forEach(b => {
                b.disabled = true;
                if (b !== btnElement) {
                    b.classList.add('opacity-40');
                }
            });

            // 根据对错设置按钮样式和底部弹窗内容
            if (isCorrect) {
                btnElement.classList.remove('border-transparent');
                btnElement.classList.add('border-green-400', 'bg-green-50');
                showBottomSheet(true, q);
            } else {
                btnElement.classList.remove('border-transparent');
                btnElement.classList.add('border-red-400', 'bg-red-50');
                showBottomSheet(false, q);
            }
            
            // 更新进度条为当前题已做完
            dom.progressBar.style.width = `${((currentIndex + 1) / questionsData.length) * 100}%`;
        }

        // 显示底部反馈弹窗
        function showBottomSheet(isCorrect, qData) {
            // 设置主题色
            if (isCorrect) {
                dom.bottomSheet.classList.remove('bg-red-50');
                dom.bottomSheet.classList.add('bg-green-50');
                
                dom.feedbackTitle.className = 'text-xl font-bold mb-2 text-green-800';
                dom.feedbackTitle.innerText = '? 正确答案：' + qData.options[qData.correctIndex];
                
                dom.feedbackDesc.className = 'text-green-700 text-sm leading-relaxed mb-6';
                
                dom.nextBtn.className = 'w-full py-4 rounded-xl font-bold text-white text-lg btn-press bg-green-500 hover:bg-green-600 shadow-md shadow-green-200';
            } else {
                dom.bottomSheet.classList.remove('bg-green-50');
                dom.bottomSheet.classList.add('bg-red-50');
                
                dom.feedbackTitle.className = 'text-xl font-bold mb-2 text-red-800';
                dom.feedbackTitle.innerText = '? 正确答案：' + qData.options[qData.correctIndex];
                
                dom.feedbackDesc.className = 'text-red-700 text-sm leading-relaxed mb-6';
                
                dom.nextBtn.className = 'w-full py-4 rounded-xl font-bold text-white text-lg btn-press bg-red-500 hover:bg-red-600 shadow-md shadow-red-200';
            }

            dom.feedbackDesc.innerText = qData.explanation;

            // 弹出动画
            dom.bottomSheet.classList.add('bottom-sheet-active');
            dom.bottomSheet.classList.remove('bottom-sheet-enter');
        }

        // 隐藏底部反馈弹窗
        function hideBottomSheet() {
            dom.bottomSheet.classList.remove('bottom-sheet-active');
            dom.bottomSheet.classList.add('bottom-sheet-enter');
            // 恢复背景色默认，防止下次闪烁
            setTimeout(() => {
                dom.bottomSheet.classList.remove('bg-green-50', 'bg-red-50');
                dom.bottomSheet.classList.add('bg-white');
            }, 300);
        }

        // 下一题
        function nextQuestion() {
            // 做一个简单的渐出渐入动画
            dom.questionContainer.style.opacity = '0';
            hideBottomSheet();
            
            setTimeout(() => {
                currentIndex++;
                renderQuestion();
                dom.questionContainer.style.opacity = '1';
            }, 300);
        }

        // 显示结算页
        function showResult() {
            dom.questionContainer.classList.add('hidden');
            dom.resultContainer.classList.remove('hidden');
            dom.resultContainer.classList.add('flex');
            dom.progressBar.style.width = '100%';
        }

        // 重新开始
        function restartApp() {
            currentIndex = 0;
            dom.resultContainer.classList.add('hidden');
            dom.resultContainer.classList.remove('flex');
            dom.questionContainer.classList.remove('hidden');
            renderQuestion();
        }

        // 模拟发音点击 (弹窗提示)
        function playAudio() {
            // 这里可以替换为真实的 new Audio('url').play()
            const word = questionsData[currentIndex].furigana;
            console.log(`播放声音: ${word}`);
            // 简易视觉反馈
            const btn = document.querySelector('button svg').parentElement;
            btn.classList.add('scale-110', 'bg-blue-200');
            setTimeout(() => {
                btn.classList.remove('scale-110', 'bg-blue-200');
            }, 200);
        }

        // 初始渲染
        renderQuestion();
    </script>
</body>
</html>
