<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nemo 学习模块重构 · 交互式测试验收工作台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f17;
      --surface: #141b27;
      --surface-card: #182232;
      --surface-hover: #1f2d42;
      --border: rgba(255, 255, 255, 0.08);
      --border-active: rgba(59, 130, 246, 0.5);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --primary: #3b82f6;
      --primary-glow: rgba(59, 130, 246, 0.25);
      --success: #10b981;
      --success-glow: rgba(16, 185, 129, 0.2);
      --warning: #f59e0b;
      --warning-glow: rgba(245, 158, 11, 0.25);
      --danger: #ef4444;
      --danger-glow: rgba(239, 68, 68, 0.25);
      --accent: #8b5cf6;
      --card-radius: 14px;
      --transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
      padding-bottom: 90px;
      background-image: 
        radial-gradient(circle at 15% 10%, rgba(59, 130, 246, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 70%, rgba(139, 92, 246, 0.06) 0%, transparent 45%);
      min-height: 100vh;
    }

    /* 顶部导航与状态条 */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      background: rgba(11, 15, 23, 0.88);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
    }

    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .logo-badge {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, #3b82f6, #06b6d4);
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 4px 16px var(--primary-glow);
    }

    .logo-text h1 {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .version-pill {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.3);
    }

    .header-sub-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 2px;
    }

    .save-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      color: #34d399;
      font-weight: 500;
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.4; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.2); }
      100% { opacity: 0.4; transform: scale(0.9); }
    }

    /* 统计卡片与进度 */
    .stats-container {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .progress-box {
      min-width: 190px;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .progress-track {
      height: 8px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #10b981);
      width: 0%;
      transition: width 0.35s ease;
      box-shadow: 0 0 12px var(--success-glow);
    }

    .stats-pills {
      display: flex;
      gap: 8px;
    }

    .stat-pill {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 6px 12px;
      border-radius: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      min-width: 60px;
    }

    .stat-pill .num {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.1;
    }

    .stat-pill .lbl {
      font-size: 0.65rem;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-top: 2px;
    }

    .stat-pill.success .num { color: var(--success); }
    .stat-pill.danger .num { color: var(--danger); }
    .stat-pill.total .num { color: #60a5fa; }

    /* 操作工具栏 */
    .actions-bar {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      font-size: 0.82rem;
      font-weight: 600;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-main);
      cursor: pointer;
      transition: var(--transition);
      user-select: none;
    }

    .btn:hover {
      background: var(--surface-hover);
      border-color: rgba(255, 255, 255, 0.16);
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-primary {
      background: #2563eb;
      border-color: #3b82f6;
      color: #fff;
      box-shadow: 0 2px 10px var(--primary-glow);
    }

    .btn-primary:hover {
      background: #1d4ed8;
      border-color: #60a5fa;
    }

    .btn-outline-safe {
      border-color: rgba(16, 185, 129, 0.4);
      color: #34d399;
      background: rgba(16, 185, 129, 0.08);
    }

    .btn-outline-safe:hover {
      background: rgba(16, 185, 129, 0.16);
      border-color: rgba(16, 185, 129, 0.6);
    }

    .btn-danger-ghost {
      color: #f87171;
    }

    .btn-danger-ghost:hover {
      background: rgba(239, 68, 68, 0.12);
      border-color: rgba(239, 68, 68, 0.3);
    }

    /* 主内容区域 */
    main {
      max-width: 1200px;
      margin: 24px auto;
      padding: 0 24px;
    }

    /* 过滤工具条 */
    .filter-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
      background: var(--surface);
      padding: 10px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .filter-tabs {
      display: flex;
      gap: 6px;
    }

    .filter-tab {
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      background: transparent;
      border: none;
      transition: var(--transition);
    }

    .filter-tab:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.04);
    }

    .filter-tab.active {
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
      font-weight: 600;
      border: 1px solid rgba(59, 130, 246, 0.3);
    }

    .search-box {
      display: flex;
      align-items: center;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 12px;
      gap: 8px;
    }

    .search-box input {
      background: transparent;
      border: none;
      color: var(--text-main);
      font-size: 0.82rem;
      outline: none;
      width: 180px;
    }

    /* 环节分组 Card */
    .stage-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--card-radius);
      margin-bottom: 20px;
      overflow: hidden;
      transition: var(--transition);
    }

    .stage-section:hover {
      border-color: rgba(255, 255, 255, 0.12);
    }

    .stage-header {
      padding: 16px 20px;
      background: rgba(255, 255, 255, 0.02);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
    }

    .stage-title-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .stage-num-badge {
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.3);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
    }

    .stage-title {
      font-size: 0.98rem;
      font-weight: 700;
    }

    .stage-subtitle {
      font-size: 0.78rem;
      color: var(--text-dim);
      margin-left: 8px;
      font-family: 'JetBrains Mono', monospace;
    }

    .stage-progress {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .stage-ratio {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .chevron {
      color: var(--text-dim);
      transition: transform 0.25s ease;
      font-size: 0.8rem;
    }

    .stage-section.collapsed .stage-content {
      display: none;
    }

    .stage-section.collapsed .chevron {
      transform: rotate(-90deg);
    }

    /* 环节内容 */
    .stage-content {
      padding: 18px 20px;
    }

    .stage-desc {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.06);
    }

    .stage-steps {
      background: rgba(0, 0, 0, 0.15);
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 16px;
      font-size: 0.8rem;
      color: #cbd5e1;
    }

    .stage-steps ol {
      padding-left: 20px;
      margin-top: 6px;
    }

    .stage-steps li {
      margin-bottom: 4px;
    }

    /* 检查项列表 */
    .checklist {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .check-item {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 12px 14px;
      background: var(--surface-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      transition: var(--transition);
    }

    .check-item:hover {
      background: var(--surface-hover);
      border-color: rgba(255, 255, 255, 0.12);
    }

    .check-item.passed {
      border-color: rgba(16, 185, 129, 0.35);
      background: rgba(16, 185, 129, 0.04);
    }

    .check-item.failed {
      border-color: rgba(239, 68, 68, 0.4);
      background: rgba(239, 68, 68, 0.05);
    }

    /* 自定义复选框 */
    .checkbox-wrap {
      padding-top: 2px;
    }

    .custom-checkbox {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      border: 2px solid #64748b;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
      background: transparent;
    }

    .custom-checkbox:hover {
      border-color: #94a3b8;
    }

    .check-item.passed .custom-checkbox {
      background: var(--success);
      border-color: var(--success);
      box-shadow: 0 0 10px var(--success-glow);
    }

    .custom-checkbox svg {
      width: 12px;
      height: 12px;
      stroke: #fff;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      opacity: 0;
      transform: scale(0.6);
      transition: var(--transition);
    }

    .check-item.passed .custom-checkbox svg {
      opacity: 1;
      transform: scale(1);
    }

    .item-body {
      flex: 1;
    }

    .item-title {
      font-size: 0.88rem;
      font-weight: 600;
      margin-bottom: 3px;
      color: var(--text-main);
    }

    .check-item.passed .item-title {
      color: #93c5fd;
    }

    .item-desc {
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    /* 状态切换器与备注 */
    .item-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-badge {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
      cursor: pointer;
      user-select: none;
      transition: var(--transition);
    }

    .status-badge.status-pass {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .status-badge.status-fail {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .status-badge.status-pending {
      background: rgba(100, 116, 139, 0.15);
      color: #94a3b8;
      border: 1px solid rgba(100, 116, 139, 0.25);
    }

    .btn-icon {
      background: transparent;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 6px;
      transition: var(--transition);
    }

    .btn-icon:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.06);
    }

    /* 备注输入框 */
    .note-drawer {
      margin-top: 10px;
      display: none;
    }

    .note-drawer.open {
      display: block;
    }

    .note-drawer textarea {
      width: 100%;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      color: var(--text-main);
      font-size: 0.78rem;
      font-family: inherit;
      resize: vertical;
      min-height: 50px;
      outline: none;
    }

    .note-drawer textarea:focus {
      border-color: var(--primary);
    }

    /* 浮动操作栏（导出报告） */
    .floating-bar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(20, 27, 39, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 10px 20px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(59, 130, 246, 0.15);
      z-index: 1000;
    }

    .floating-text {
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text-muted);
    }

    .floating-text strong {
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
    }

    /* 撤销 Toast 弹窗 */
    .toast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #1e293b;
      color: #fff;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 0.84rem;
      font-weight: 500;
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 2000;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      pointer-events: auto;
    }

    .toast-undo-btn {
      background: rgba(59, 130, 246, 0.2);
      border: 1px solid rgba(59, 130, 246, 0.4);
      color: #93c5fd;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: var(--transition);
    }

    .toast-undo-btn:hover {
      background: #2563eb;
      color: #fff;
    }

    /* 毛玻璃通用模态弹窗 */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 3000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      padding: 20px;
    }

    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: #151d2a;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      width: 100%;
      max-width: 480px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 30px rgba(59, 130, 246, 0.15);
      transform: scale(0.95);
      transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .modal-overlay.open .modal-card {
      transform: scale(1);
    }

    .modal-card.modal-large {
      max-width: 640px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
    }

    .modal-header-icon {
      font-size: 28px;
      margin-bottom: 12px;
      display: inline-block;
    }

    .modal-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    .modal-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 18px;
    }

    .modal-checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      color: var(--text-dim);
      margin-bottom: 20px;
      user-select: none;
      cursor: pointer;
    }

    .modal-checkbox-row input {
      cursor: pointer;
      accent-color: var(--primary);
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .btn-danger {
      background: #dc2626;
      border-color: #ef4444;
      color: #fff;
    }

    .btn-danger:hover {
      background: #b91c1c;
    }

    /* 快照历史列表 */
    .snapshot-list {
      max-height: 240px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.2);
      margin-top: 10px;
    }

    .snapshot-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      font-size: 0.8rem;
    }

    .snapshot-item:last-child {
      border-bottom: none;
    }

    .snapshot-time {
      font-family: 'JetBrains Mono', monospace;
      color: #93c5fd;
      font-size: 0.78rem;
    }

    .snapshot-info {
      color: var(--text-muted);
      font-size: 0.75rem;
    }

    /* 响应式 */
    @media (max-width: 768px) {
      .header-inner { flex-direction: column; align-items: stretch; }
      .stats-container { justify-content: space-between; }
      .actions-bar { justify-content: flex-end; flex-wrap: wrap; }
      .floating-bar { width: 92%; justify-content: space-between; }
    }
  </style>
</head>
<body>

  <!-- 顶部导航与状态条 -->
  <header>
    <div class="header-inner">
      <div class="logo-badge">
        <div class="logo-icon">🐠</div>
        <div class="logo-text">
          <h1>Nemo 学习模块重构 · 交互式测试台 <span class="version-pill">7 Delegate</span></h1>
          <div class="header-sub-row">
            <span class="save-indicator">
              <span class="pulse-dot"></span>
              <span id="save-status-text">实时自动落盘已就绪</span>
            </span>
          </div>
        </div>
      </div>

      <div class="stats-container">
        <div class="progress-box">
          <div class="progress-meta">
            <span style="color: var(--text-muted);">整体验收进度</span>
            <span id="progress-percent" style="color: #60a5fa;">0%</span>
          </div>
          <div class="progress-track">
            <div class="progress-bar" id="progress-bar"></div>
          </div>
        </div>

        <div class="stats-pills">
          <div class="stat-pill total">
            <span class="num" id="stat-total">0</span>
            <span class="lbl">总项</span>
          </div>
          <div class="stat-pill success">
            <span class="num" id="stat-passed">0</span>
            <span class="lbl">通过</span>
          </div>
          <div class="stat-pill danger">
            <span class="num" id="stat-failed">0</span>
            <span class="lbl">缺陷</span>
          </div>
        </div>
      </div>

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        const data = raw ? JSON.parse(raw) : {};
        for (const [id, val] of Object.entries(DEFAULT_VERIFIED_STATE)) {
          if (!data[id]) {
            data[id] = val;
          }
        }
        return data;
      } catch (e) {
        return JSON.parse(JSON.stringify(DEFAULT_VERIFIED_STATE));
      }
    }

    function saveState(state) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      updateSaveTimestamp();
    }

    function loadSnapshots() {
      try {
        const raw = localStorage.getItem(SNAPSHOTS_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch (e) {
        return [];
      }
    }

    function saveSnapshots(snapshots) {
      localStorage.setItem(SNAPSHOTS_KEY, JSON.stringify(snapshots.slice(0, 10))); // 最多保留 10 个快照
    }

    let appState = loadState();
    let currentFilter = 'all';
    let searchQuery = '';

    // 操作撤销栈（用于防误触一键恢复）
    let undoHistoryStack = []; // [{ prevState, desc }]

    function pushUndoHistory(desc) {
      // 深度拷贝一份状态
      const snapshot = JSON.parse(JSON.stringify(appState));
      undoHistoryStack.push({ state: snapshot, desc: desc });
      if (undoHistoryStack.length > 20) {
        undoHistoryStack.shift();
      }
    }

    function undoLastAction() {
      if (undoHistoryStack.length === 0) {
        showToast('没有可撤销的操作', false);
        return;
      }
      const last = undoHistoryStack.pop();
      appState = last.state;
      saveState(appState);
      renderApp();
      showToast(`已成功撤销操作：${last.desc} ↺`, false);
    }

    function updateSaveTimestamp() {
      const el = document.getElementById('save-status-text');
      if (el) {
        const timeStr = new Date().toLocaleTimeString();
        el.innerText = `本地实时落盘安全 (${timeStr})`;
      }
    }

    // ==========================================
    // 取消勾选防误触确认逻辑
    // ==========================================
    let pendingAction = null; // { execute: () => {} }

    function openConfirmModal(title, desc, onConfirm) {
      const skipConfirm = localStorage.getItem(PREF_SKIP_CONFIRM_KEY) === 'true';
      if (skipConfirm) {
        // 用户勾选了不再提示，直接执行
        onConfirm();
        return;
      }

      document.getElementById('confirm-title').innerText = title;
      document.getElementById('confirm-desc').innerText = desc;
      document.getElementById('confirm-skip-checkbox').checked = false;

      pendingAction = onConfirm;
      document.getElementById('confirm-modal').classList.add('open');
    }

    document.getElementById('confirm-cancel-btn').addEventListener('click', () => {
      document.getElementById('confirm-modal').classList.remove('open');
      pendingAction = null;
    });

    document.getElementById('confirm-ok-btn').addEventListener('click', () => {
      const isSkipChecked = document.getElementById('confirm-skip-checkbox').checked;
      if (isSkipChecked) {
        localStorage.setItem(PREF_SKIP_CONFIRM_KEY, 'true');
      }
      document.getElementById('confirm-modal').classList.remove('open');
      if (pendingAction) {
        pendingAction();
        pendingAction = null;
      }
    });

    // 单击 Checkbox / 标题切换“通过 / 待测”
    function handleItemToggleClick(itemId, itemTitle, event) {
      if (event) event.stopPropagation();
      const current = appState[itemId] || { status: 'pending', note: '' };

      // 如果当前已经是【通过】或【缺陷】状态，取消打勾属于“降级/丢弃测试结果”，触发二次确认
      if (current.status === 'pass' || current.status === 'fail' || (current.note && current.note.trim())) {
        const stateName = current.status === 'pass' ? '【已通过】' : '【发现缺陷】';
        const noteWarning = (current.note && current.note.trim()) ? '，且包含您填写的备注信息' : '';
        
        openConfirmModal(
          `确认取消${itemTitle}的测试结果？`,
          `当前测试项处于 ${stateName} 状态${noteWarning}。取消勾选将把该项重置为【未测试】。确定要继续吗？`,
          () => {
            pushUndoHistory(`取消 ${itemTitle}`);
            appState[itemId] = { ...current, status: 'pending' };
            saveState(appState);
            renderApp();
            showToast(`已重置【${itemTitle}】为待验证 ⚪`, true);
          }
        );
      } else {
        // 当前是未测试，直接打勾通过，安全顺畅
        pushUndoHistory(`通过 ${itemTitle}`);
        appState[itemId] = { ...current, status: 'pass' };
        saveState(appState);
        renderApp();
        showToast(`已标记【${itemTitle}】为通过 🟢`, true);
      }
    }

    // 状态切换按钮点击（待测 -> 通过 -> 缺陷 -> 待测）
    function cycleItemStatus(itemId, itemTitle) {
      const current = appState[itemId] || { status: 'pending', note: '' };

      if (current.status === 'pass') {
        // 从通过切到缺陷
        pushUndoHistory(`标记缺陷 ${itemTitle}`);
        appState[itemId] = { ...current, status: 'fail' };
        saveState(appState);
        renderApp();
        showToast(`已将【${itemTitle}】标记为缺陷 🔴`, true);
      } else if (current.status === 'fail') {
        // 从缺陷切回待验证（可能丢失缺陷备注，二次确认）
        openConfirmModal(
          `确认重置【${itemTitle}】的缺陷状态？`,
          `该项目已被标记为缺陷。重置后将清除红标状态回到待验证。确定继续吗？`,
          () => {
            pushUndoHistory(`重置缺陷 ${itemTitle}`);
            appState[itemId] = { ...current, status: 'pending' };
            saveState(appState);
            renderApp();
            showToast(`已重置【${itemTitle}】为待验证 ⚪`, true);
          }
        );
      } else {
        // 待测切为通过
        pushUndoHistory(`通过 ${itemTitle}`);
        appState[itemId] = { ...current, status: 'pass' };
        saveState(appState);
        renderApp();
        showToast(`已标记【${itemTitle}】为通过 🟢`, true);
      }
    }

    // 展开/收起备注抽屉
    function toggleNoteDrawer(itemId) {
      const drawer = document.getElementById(`note_drawer_${itemId}`);
      if (drawer) {
        drawer.classList.toggle('open');
      }
    }

    function updateItemNote(itemId, noteText) {
      const current = appState[itemId] || { status: 'pending', note: '' };
      appState[itemId] = { ...current, note: noteText };
      saveState(appState);
    }

    // 环节折叠/展开
    function toggleStageCollapse(stageId) {
      const sec = document.getElementById(`section_${stageId}`);
      if (sec) {
        sec.classList.toggle('collapsed');
      }
    }

    // 过滤切换
    function setFilter(filterType, el) {
      currentFilter = filterType;
      document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
      if (el) el.classList.add('active');
      renderApp();
    }

    function handleSearch() {
      searchQuery = document.getElementById('searchInput').value.trim();
      renderApp();
    }

    // ==========================================
    // 重置与安全快照体系
    // ==========================================

    function triggerSafeReset() {
      openConfirmModal(
        '⚠️ 危险操作：确认重置全部测试进度？',
        '系统在清空前会自动为您创建一份紧急安全快照！即使误清空，您也可随时在【安全与快照】中心一键撤销并恢复所有数据。',
        () => {
          // 1. 自动快照入库
          createAutoSnapshot('重置前紧急快照备份');
          // 2. 推送当前进入撤销栈
          pushUndoHistory('全量重置进度');
          // 3. 清空
          appState = {};
          saveState(appState);
          renderApp();
          showToast('进度已重置。已自动为您保存紧急快照备份！', true);
        }
      );
    }

    function createAutoSnapshot(label = '自动安全快照') {
      const snapshots = loadSnapshots();
      const newSnap = {
        id: 'snap_' + Date.now(),
        time: new Date().toLocaleString(),
        label: label,
        data: JSON.parse(JSON.stringify(appState)),
        passedCount: Object.values(appState).filter(v => v.status === 'pass').length,
        totalCount: Object.keys(appState).length
      };
      snapshots.unshift(newSnap);
      saveSnapshots(snapshots);
      renderSnapshotsList();
    }

    function createManualSnapshot() {
      createAutoSnapshot('手动保存快照');
      showToast('📸 成功创建一份当前测试进度快照！', false);
    }

    function restoreSnapshot(snapId) {
      const snapshots = loadSnapshots();
      const target = snapshots.find(s => s.id === snapId);
      if (!target) return;

      openConfirmModal(
        `确认恢复快照【${target.time}】？`,
        `恢复后将覆盖当前进度（该快照记录了 ${target.passedCount} 项通过验证）。系统在恢复前也会自动为您保留当前进度的镜像。`,
        () => {
          createAutoSnapshot('恢复前镜像');
          pushUndoHistory('恢复历史快照');
          appState = target.data;
          saveState(appState);
          renderApp();
          closeSafetyCenterModal();
          showToast(`已成功恢复快照：${target.time} 🚀`, true);
        }
      );
    }

    function openSafetyCenterModal() {
      renderSnapshotsList();
      document.getElementById('safety-modal').classList.add('open');
    }

    function closeSafetyCenterModal() {
      document.getElementById('safety-modal').classList.remove('open');
    }

    function renderSnapshotsList() {
      const container = document.getElementById('snapshot-list-container');
      const snapshots = loadSnapshots();
      if (snapshots.length === 0) {
        container.innerHTML = `<div style="padding: 16px; text-align: center; color: var(--text-dim); font-size: 0.8rem;">暂无历史快照，执行重置或手动创建时将自动记录。</div>`;
        return;
      }
      container.innerHTML = snapshots.map(s => `
        <div class="snapshot-item">
          <div>
            <span class="snapshot-time">${s.time}</span>
            <span style="margin: 0 6px; color: #64748b;">·</span>
            <span style="font-weight: 600; color: #f1f5f9;">${s.label}</span>
            <div class="snapshot-info">记录已通过: ${s.passedCount} 项</div>
          </div>
          <button class="btn" style="padding: 4px 10px; font-size: 0.75rem;" onclick="restoreSnapshot('${s.id}')">
            一键回滚恢复
          </button>
        </div>
      `).join('');
    }

    // 导出 JSON 备份
    function downloadBackupJson() {
      const backup = {
        app: "Nemo Learning Refactor QA Test Workbench",
        version: "v2.0",
        exportTime: new Date().toISOString(),
        state: appState
      };
      const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Nemo_Learning_Test_Backup_${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('备份文件已下载 💾', false);
    }

    // 导入 JSON 恢复
    function handleImportJson(input) {
      const file = input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const parsed = JSON.parse(e.target.result);
          if (parsed && parsed.state) {
            createAutoSnapshot('导入前自动备份');
            pushUndoHistory('导入外部备份文件');
            appState = parsed.state;
            saveState(appState);
            renderApp();
            closeSafetyCenterModal();
            showToast('✅ 成功从备份文件导入所有测试结果！', true);
          } else {
            alert('无效的备份文件格式！');
          }
        } catch (err) {
          alert('解析备份 JSON 失败: ' + err.message);
        }
      };
      reader.readAsText(file);
      input.value = '';
    }

    // 复制当前测试勾选记录 Markdown
    function copyProgressMarkdown() {
      let md = generateMarkdownText();
      navigator.clipboard.writeText(md).then(() => {
        showToast('已复制完整勾选记录到剪贴板 📋', false);
      }).catch(err => {
        alert('复制失败，请手动导出报告');
      });
    }

    // 导出验收报告文件下载
    function exportMarkdownReport() {
      let md = generateMarkdownText();
      const blob = new Blob([md], { type: 'text/markdown;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Nemo学习模块测试验收报告_${new Date().toISOString().slice(0,10)}.md`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('验收报告已导出为 Markdown 文件 💾', false);
    }

    function generateMarkdownText() {
      let total = 0;
      let passed = 0;
      let failed = 0;

      let sectionsMd = '';

      TEST_STAGES.forEach(stage => {
        let stagePassed = 0;
        let itemsMd = '';

        stage.items.forEach(item => {
          total++;
          const state = appState[item.id] || { status: 'pending', note: '' };
          let mark = '[ ]';
          let statusText = 'PENDING';
          if (state.status === 'pass') {
            mark = '[x]';
            statusText = 'PASSED';
            passed++;
            stagePassed++;
          } else if (state.status === 'fail') {
            mark = '[!]';
            statusText = 'FAILED';
            failed++;
          }

          itemsMd += `- ${mark} **${item.title}** (${statusText})\n  > 校验要求: ${item.desc}\n`;
          if (state.note && state.note.trim()) {
            itemsMd += `  > 📝 **测试备注/现象**: ${state.note.trim()}\n`;
          }
        });

        sectionsMd += `\n### 【环节 ${stage.num}】${stage.title} (${stagePassed}/${stage.items.length})\n* 模块: \`${stage.module}\`\n\n${itemsMd}`;
      });

      const percent = total > 0 ? Math.round((passed / total) * 100) : 0;
      const now = new Date().toLocaleString();

      return `# Nemo 学习模块重构实机验收报告

> 生成时间: ${now}  
> 总体通过率: **${percent}%** (通过: ${passed} / 缺陷: ${failed} / 总项: ${total})

---

## 验收执行汇总清单
${sectionsMd}

---
*由 Nemo 学习模块交互式测试台自动生成*
`;
    }

    // 显示 Toast（带可选的撤销按钮）
    let toastTimer = null;
    function showToast(msg, showUndo = false) {
      const toast = document.getElementById('toast');
      const text = document.getElementById('toast-text');
      const undoBtn = document.getElementById('toast-undo-btn');

      text.innerText = msg;
      undoBtn.style.display = (showUndo && undoHistoryStack.length > 0) ? 'inline-block' : 'none';

      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove('show');
      }, showUndo ? 4500 : 2500);
    }

    // 页面意外关闭/刷新保护：当用户正在编写备注时提示
    window.addEventListener('beforeunload', (e) => {
      const activeEl = document.activeElement;
      if (activeEl && activeEl.tagName === 'TEXTAREA' && activeEl.value.trim().length > 0) {
        e.preventDefault();
        e.returnValue = '您有未保存的备注内容，确定要离开吗？';
      }
    });

    // 渲染主应用
    function renderApp() {
      const container = document.getElementById('stages-wrapper');
      container.innerHTML = '';

      let totalItems = 0;
      let passedItems = 0;
      let failedItems = 0;

      TEST_STAGES.forEach(stage => {
        let stageTotal = stage.items.length;
        let stagePassed = 0;

        const stageCard = document.createElement('div');
        stageCard.className = 'stage-section';
        stageCard.id = `section_${stage.id}`;

        let itemsHtml = '';
        stage.items.forEach(item => {
          totalItems++;
          const itemState = appState[item.id] || { status: 'pending', note: '' };
          const isPassed = itemState.status === 'pass';
          const isFailed = itemState.status === 'fail';

          if (isPassed) {
            passedItems++;
            stagePassed++;
          }
          if (isFailed) {
            failedItems++;
          }

          // 过滤条件判断
          let isVisible = true;
          if (currentFilter === 'pending' && itemState.status !== 'pending') isVisible = false;
          if (currentFilter === 'passed' && !isPassed) isVisible = false;
          if (currentFilter === 'failed' && !isFailed) isVisible = false;

          if (searchQuery) {
            const textToSearch = (stage.title + stage.module + item.title + item.desc).toLowerCase();
            if (!textToSearch.includes(searchQuery.toLowerCase())) {
              isVisible = false;
            }
          }

          if (!isVisible) return;

          let badgeClass = 'status-pending';
          let badgeText = '待验证 ⚪';
          if (isPassed) {
            badgeClass = 'status-pass';
            badgeText = '已通过 🟢';
          } else if (isFailed) {
            badgeClass = 'status-fail';
            badgeText = '发现缺陷 🔴';
          }

          const hasNote = Boolean(itemState.note && itemState.note.trim());
          const isNoteOpen = isFailed || hasNote;

          itemsHtml += `
            <div class="check-item ${isPassed ? 'passed' : ''} ${isFailed ? 'failed' : ''}" id="item_${item.id}">
              <div class="checkbox-wrap" onclick="handleItemToggleClick('${item.id}', '${item.title}', event)">
                <div class="custom-checkbox">
                  <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
                </div>
              </div>

              <div class="item-body">
                <div class="item-title" onclick="handleItemToggleClick('${item.id}', '${item.title}', event)" style="cursor: pointer;">
                  ${item.title}
                </div>
                <div class="item-desc">${item.desc}</div>

                <div class="note-drawer ${isNoteOpen ? 'open' : ''}" id="note_drawer_${item.id}">
                  <textarea placeholder="输入复现步骤、缺陷现象或测试备注..." onchange="updateItemNote('${item.id}', this.value)">${itemState.note || ''}</textarea>
                </div>
              </div>

              <div class="item-controls">
                <span class="status-badge ${badgeClass}" onclick="cycleItemStatus('${item.id}', '${item.title}')">
                  ${badgeText}
                </span>
                <button class="btn-icon" title="展开/收起备注" onclick="toggleNoteDrawer('${item.id}')">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                </button>
              </div>
            </div>
          `;
        });

        // 如果本环节过滤后无任何条目，则跳过
        if (!itemsHtml && (currentFilter !== 'all' || searchQuery)) {
          return;
        }

        stageCard.innerHTML = `
          <div class="stage-header" onclick="toggleStageCollapse('${stage.id}')">
            <div class="stage-title-wrap">
              <span class="stage-num-badge">${stage.num}</span>
              <div>
                <span class="stage-title">${stage.title}</span>
                <span class="stage-subtitle">${stage.module}</span>
              </div>
            </div>

            <div class="stage-progress">
              <span class="stage-ratio">${stagePassed} / ${stageTotal}</span>
              <span class="chevron">▼</span>
            </div>
          </div>

          <div class="stage-content">
            <div class="stage-desc">
              <span>🎯 ${stage.desc}</span>
            </div>

            <div class="stage-steps">
              <strong>🛠️ 推荐操作步骤：</strong>
              <ol>
                ${stage.steps.map(s => `<li>${s}</li>`).join('')}
              </ol>
            </div>

            <div class="checklist">
              ${itemsHtml}
            </div>
          </div>
        `;

        container.appendChild(stageCard);
      });

      // 更新整体统计信息
      const percent = totalItems > 0 ? Math.round((passedItems / totalItems) * 100) : 0;
      document.getElementById('stat-total').innerText = totalItems;
      document.getElementById('stat-passed').innerText = passedItems;
      document.getElementById('stat-failed').innerText = failedItems;
      document.getElementById('progress-percent').innerText = `${percent}%`;
      document.getElementById('progress-bar').style.width = `${percent}%`;

      document.getElementById('float-total').innerText = totalItems;
      document.getElementById('float-passed').innerText = passedItems;
      document.getElementById('float-percent').innerText = `${percent}%`;
    }

    // 启动初始加载与初次落盘提示
    renderApp();
    updateSaveTimestamp();
  </script>
</body>
</html>
