<!doctype html>
<html lang="zh-CN"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>Nemo · 右上角菜单动效预览</title>
  <style>
    :root {
      --ink: #162036;
      --muted: #667085;
      --line: rgba(19, 32, 57, .10);
      --canvas: #f2f5f9;
      --paper: rgba(255, 255, 255, .82);
      --navy: #17284f;
      --blue: #386dff;
      --blue-soft: #e9efff;
      --coral: #ff775e;
      --mint: #79dcb6;
      --open-ease: cubic-bezier(.22, 1, .36, 1);
      --close-ease: cubic-bezier(.40, 0, .80, .20);
      --display: "Aptos Display", "HarmonyOS Sans SC", "Microsoft YaHei UI", sans-serif;
      --body: "Aptos", "PingFang SC", "Microsoft YaHei UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html { min-height: 100%; background: var(--canvas); }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      font-family: var(--body);
      background:
        radial-gradient(circle at 4% 2%, rgba(121, 220, 182, .28), transparent 22rem),
        radial-gradient(circle at 94% 87%, rgba(56, 109, 255, .15), transparent 28rem),
        var(--canvas);
    }

    button { font: inherit; }

    .page {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(260px, 390px) minmax(390px, 1fr);
      align-items: center;
      gap: clamp(32px, 7vw, 116px);
      max-width: 1280px;
      margin: 0 auto;
      padding: clamp(28px, 6vw, 76px) clamp(22px, 6vw, 80px);
    }

    .brief {
      position: relative;
      max-width: 390px;
    }

    .brief::before {
      position: absolute;
      z-index: -1;
      top: -52px;
      left: -38px;
      width: 96px;
      height: 96px;
      border: 1px solid rgba(56, 109, 255, .18);
      border-radius: 50%;
      content: "";
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 18px;
      color: #3a63d9;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .15em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--coral);
      box-shadow: 0 0 0 5px rgba(255, 119, 94, .15);
      content: "";
    }

    h1 {
      max-width: 360px;
      margin: 0;
      color: var(--navy);
      font-family: var(--display);
      font-size: clamp(38px, 4vw, 56px);
      font-weight: 800;
      letter-spacing: -.075em;
      line-height: .99;
    }

    .lede {
      max-width: 350px;
      margin: 20px 0 0;
      color: var(--muted);
      font-size: 15px;
      font-weight: 500;
      line-height: 1.8;
    }

    .motion-spec {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      max-width: 370px;
      margin: 31px 0 0;
    }

    .motion-spec__item {
      min-width: 0;
      padding: 11px 11px 10px;
      border: 1px solid rgba(22, 32, 54, .08);
      border-radius: 14px;
      background: rgba(255, 255, 255, .58);
      backdrop-filter: blur(10px);
    }

    .motion-spec__label {
      display: block;
      overflow: hidden;
      color: #7c879b;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .08em;
      text-overflow: ellipsis;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .motion-spec__value {
      display: block;
      margin-top: 6px;
      color: var(--navy);
      font-family: var(--display);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: -.03em;
    }

    .demo-button {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-top: 28px;
      padding: 12px 15px 12px 14px;
      border: 1px solid rgba(23, 40, 79, .12);
      border-radius: 999px;
      color: var(--navy);
      background: rgba(255, 255, 255, .74);
      box-shadow: 0 8px 24px rgba(22, 37, 74, .06);
      cursor: pointer;
      font-size: 13px;
      font-weight: 750;
      transition: transform 180ms ease, box-shadow 180ms ease, background 180ms ease;
    }

    .demo-button:hover {
      background: #fff;
      box-shadow: 0 12px 28px rgba(22, 37, 74, .10);
      transform: translateY(-2px);
    }

    .demo-button:focus-visible,
    .menu-trigger:focus-visible,
    .menu-item:focus-visible {
      outline: 3px solid rgba(56, 109, 255, .38);
      outline-offset: 3px;
    }

    .demo-button svg { width: 16px; height: 16px; fill: currentColor; }

    .device-stage {
      display: grid;
      justify-items: center;
      width: min(100%, 520px);
    }

    .device-note {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 15px;
      color: #758199;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .04em;
    }

    .device-note__dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--mint);
      box-shadow: 0 0 0 4px rgba(121, 220, 182, .18);
    }

    .phone-viewport {
      width: 390px;
      height: 816px;
    }

    .phone {
      position: relative;
      width: 390px;
      height: 816px;
      padding: 9px;
      border-radius: 52px;
      background:
        linear-gradient(125deg, #171b27 0%, #33394a 45%, #12151e 100%);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, .52) inset,
        0 0 0 2px rgba(5, 10, 25, .15),
        0 28px 50px rgba(28, 40, 70, .18),
        0 8px 18px rgba(28, 40, 70, .10);
    }

    .phone::before,
    .phone::after {
      position: absolute;
      right: -3px;
      width: 3px;
      border-radius: 0 3px 3px 0;
      background: #31394a;
      content: "";
    }

    .phone::before { top: 158px; height: 72px; }
    .phone::after { top: 252px; height: 130px; }

    .phone-screen {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: 44px;
      background: #f8f9fd;
      isolation: isolate;
    }

    .dynamic-island {
      position: absolute;
      z-index: 25;
      top: 10px;
      left: 50%;
      width: 112px;
      height: 29px;
      border-radius: 999px;
      background: #0b0c11;
      box-shadow: 0 1px 4px rgba(0, 0, 0, .33);
      transform: translateX(-50%);
    }

    .app-layer {
      position: relative;
      z-index: 1;
      min-height: 100%;
      transition: filter 250ms var(--close-ease), transform 250ms var(--close-ease), opacity 180ms ease;
    }

    .phone--menu-open .app-layer {
      opacity: .74;
      filter: blur(1.4px);
      transform: scale(.992);
      transition: filter 260ms var(--open-ease), transform 350ms var(--open-ease), opacity 200ms ease;
    }

    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 55px;
      padding: 13px 25px 0 27px;
      color: #172033;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .01em;
    }

    .status-icons { display: flex; align-items: center; gap: 6px; }
    .status-icons svg { display: block; fill: currentColor; }

    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 67px;
      padding: 0 17px 0 23px;
    }

    .brand-lockup { display: flex; align-items: center; gap: 10px; }

    .brand-mark {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border-radius: 12px;
      color: #fff;
      background: linear-gradient(145deg, #396fff, #224bd1);
      box-shadow: 0 8px 18px rgba(56, 109, 255, .25);
    }

    .brand-mark svg { width: 19px; height: 19px; fill: currentColor; }

    .brand-copy { display: grid; gap: 1px; }
    .brand-copy strong { color: #17284f; font-family: var(--display); font-size: 16px; letter-spacing: -.04em; }
    .brand-copy span { color: #8993a7; font-size: 10px; font-weight: 700; }

    .menu-trigger {
      position: relative;
      z-index: 21;
      display: grid;
      width: 44px;
      height: 44px;
      place-items: center;
      padding: 0;
      border: 1px solid rgba(21, 37, 69, .07);
      border-radius: 50%;
      color: #17284f;
      background: rgba(255, 255, 255, .88);
      box-shadow: 0 7px 18px rgba(24, 44, 88, .08);
      cursor: pointer;
      transition: color 160ms ease, background 160ms ease, box-shadow 200ms ease, transform 160ms ease;
    }

    .menu-trigger:hover { box-shadow: 0 10px 22px rgba(24, 44, 88, .12); transform: translateY(-1px); }
    .menu-trigger:active { transform: scale(.93); }

    .phone--menu-open .menu-trigger {
      color: #fff;
      background: #17284f;
      box-shadow: 0 9px 23px rgba(23, 40, 79, .25);
    }

    .trigger-lines { width: 20px; height: 20px; overflow: visible; }

    .trigger-lines line {
      stroke: currentColor;
      stroke-linecap: round;
      stroke-width: 2.2;
      transform-box: fill-box;
      transform-origin: center;
      transition: transform 220ms var(--close-ease), opacity 130ms ease;
    }

    .phone--menu-open .trigger-lines line {
      transition: transform 240ms var(--open-ease), opacity 130ms ease;
    }

    .phone--menu-open .trigger-lines .line-top { transform: translateY(5px) rotate(45deg); }
    .phone--menu-open .trigger-lines .line-middle { opacity: 0; transform: scaleX(.2); }
    .phone--menu-open .trigger-lines .line-bottom { transform: translateY(-5px) rotate(-45deg); }

    .content-scroll {
      height: calc(100% - 122px);
      overflow: hidden;
      padding: 9px 18px 32px;
    }

    .welcome-row { padding: 4px 5px 17px; }
    .welcome-row p { margin: 0; color: #6f7c94; font-size: 12px; font-weight: 700; }
    .welcome-row h2 { margin: 4px 0 0; color: #162447; font-family: var(--display); font-size: 29px; font-weight: 800; letter-spacing: -.065em; }

    .focus-card {
      position: relative;
      min-height: 187px;
      overflow: hidden;
      padding: 20px;
      border-radius: 25px;
      color: #fff;
      background:
        radial-gradient(circle at 90% 14%, rgba(255, 255, 255, .22), transparent 27%),
        linear-gradient(135deg, #1e3978, #214fbe 62%, #407cff);
    }

    .focus-card::before {
      position: absolute;
      right: -34px;
      bottom: -52px;
      width: 170px;
      height: 170px;
      border: 1px solid rgba(255, 255, 255, .22);
      border-radius: 50%;
      box-shadow: 0 0 0 23px rgba(255, 255, 255, .06), 0 0 0 46px rgba(255, 255, 255, .04);
      content: "";
    }

    .focus-card__top,
    .focus-card__bottom { position: relative; z-index: 1; display: flex; align-items: center; justify-content: space-between; }
    .focus-card__top span { font-size: 12px; font-weight: 750; opacity: .8; }
    .focus-card__chip { padding: 5px 8px; border: 1px solid rgba(255, 255, 255, .18); border-radius: 999px; background: rgba(255, 255, 255, .13); font-size: 10px; font-weight: 800; }
    .focus-card__time { position: relative; z-index: 1; margin-top: 19px; font-family: var(--display); font-size: 44px; font-weight: 800; letter-spacing: -.075em; line-height: .9; }
    .focus-card__time small { margin-left: 4px; font-family: var(--body); font-size: 13px; font-weight: 750; letter-spacing: 0; }
    .focus-card__bottom { margin-top: 20px; }
    .focus-card__bottom span { font-size: 11px; font-weight: 700; opacity: .82; }
    .spark-bars { display: flex; align-items: end; height: 17px; gap: 3px; }
    .spark-bars i { display: block; width: 3px; border-radius: 4px; background: #fff; }
    .spark-bars i:nth-child(1) { height: 5px; opacity: .35; }
    .spark-bars i:nth-child(2) { height: 10px; opacity: .55; }
    .spark-bars i:nth-child(3) { height: 15px; opacity: .78; }
    .spark-bars i:nth-child(4) { height: 17px; }

    .section-line { display: flex; align-items: center; justify-content: space-between; margin: 25px 5px 12px; }
    .section-line strong { color: #1a2a4c; font-family: var(--display); font-size: 15px; letter-spacing: -.035em; }
    .section-line span { color: #7a87a0; font-size: 11px; font-weight: 750; }

    .task-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      border: 1px solid rgba(20, 39, 75, .07);
      border-radius: 19px;
      background: #fff;
    }

    .task-icon {
      display: grid;
      flex: 0 0 auto;
      width: 39px;
      height: 39px;
      place-items: center;
      border-radius: 13px;
      color: #d95a46;
      background: #fff0ec;
    }

    .task-icon svg { width: 20px; height: 20px; fill: currentColor; }
    .task-copy { display: grid; flex: 1; gap: 4px; min-width: 0; }
    .task-copy strong { overflow: hidden; color: #263657; font-size: 13px; font-weight: 800; text-overflow: ellipsis; white-space: nowrap; }
    .task-copy span { color: #8a96aa; font-size: 11px; font-weight: 650; }
    .task-count { color: #2f60e5; font-family: var(--display); font-size: 14px; font-weight: 800; letter-spacing: -.03em; }

    .bottom-home-bar { position: absolute; bottom: 8px; left: 50%; z-index: 4; width: 120px; height: 5px; border-radius: 999px; background: #1d2942; transform: translateX(-50%); }

    .menu-scrim {
      position: absolute;
      z-index: 8;
      inset: 0;
      border: 0;
      background: rgba(23, 38, 74, 0);
      cursor: default;
      opacity: 0;
      pointer-events: none;
      transition: background 140ms var(--close-ease), opacity 140ms var(--close-ease);
    }

    .phone--menu-open .menu-scrim {
      background: rgba(23, 38, 74, .24);
      opacity: 1;
      pointer-events: auto;
      transition: background 180ms var(--open-ease), opacity 180ms var(--open-ease);
    }

    .menu-panel {
      position: absolute;
      z-index: 20;
      top: 111px;
      right: 16px;
      width: 286px;
      padding: 10px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .85);
      border-radius: 25px;
      color: #162447;
      background: rgba(255, 255, 255, .97);
      box-shadow: 0 20px 44px rgba(20, 37, 77, .20), 0 4px 11px rgba(20, 37, 77, .10);
      clip-path: circle(22px at calc(100% - 24px) -24px);
      opacity: 0;
      pointer-events: none;
      transform: translate(16px, -18px) scale(.86);
      transform-origin: calc(100% - 24px) -24px;
      transition:
        clip-path 250ms var(--close-ease),
        opacity 130ms var(--close-ease),
        transform 250ms var(--close-ease);
    }

    .phone--menu-open .menu-panel {
      clip-path: circle(165% at calc(100% - 24px) -24px);
      opacity: 1;
      pointer-events: auto;
      transform: translate(0, 0) scale(1);
      transition:
        clip-path 350ms var(--open-ease),
        opacity 200ms var(--open-ease),
        transform 350ms var(--open-ease);
    }

    .menu-panel__head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 9px 10px;
    }

    .menu-panel__head strong { font-family: var(--display); font-size: 13px; font-weight: 800; letter-spacing: -.035em; }
    .menu-panel__head span { padding: 4px 7px; border-radius: 999px; color: #5274d6; background: #edf2ff; font-size: 9px; font-weight: 800; letter-spacing: .04em; }

    .menu-item {
      display: grid;
      grid-template-columns: 37px 1fr auto;
      align-items: center;
      width: 100%;
      min-height: 59px;
      padding: 8px 9px;
      border: 0;
      border-radius: 17px;
      color: #1c2b4d;
      background: transparent;
      cursor: pointer;
      opacity: 0;
      text-align: left;
      transform: translateX(16px) scale(.97);
      transition: opacity 100ms ease, transform 130ms var(--close-ease), background 150ms ease;
    }

    .phone--menu-open .menu-item {
      opacity: 1;
      transform: translateX(0) scale(1);
      transition: opacity 180ms var(--open-ease), transform 200ms var(--open-ease), background 150ms ease;
    }

    .phone--menu-open .menu-item:nth-of-type(1) { transition-delay: 105ms, 105ms, 0ms; }
    .phone--menu-open .menu-item:nth-of-type(2) { transition-delay: 150ms, 150ms, 0ms; }
    .phone--menu-open .menu-item:nth-of-type(3) { transition-delay: 195ms, 195ms, 0ms; }
    .phone--menu-open .menu-item:nth-of-type(4) { transition-delay: 240ms, 240ms, 0ms; }

    .menu-item:hover { background: #f1f5ff; }
    .menu-item:active { background: #e7efff; transform: scale(.98); }

    .menu-item__icon {
      display: grid;
      width: 31px;
      height: 31px;
      place-items: center;
      border-radius: 11px;
      color: #3d6ce8;
      background: #eaf0ff;
    }

    .menu-item--warm .menu-item__icon { color: #e6624c; background: #fff0ec; }
    .menu-item--mint .menu-item__icon { color: #1aa477; background: #e7faf3; }
    .menu-item--soft .menu-item__icon { color: #7d62db; background: #f0ebff; }
    .menu-item__icon svg { width: 17px; height: 17px; fill: currentColor; }

    .menu-item__copy { display: grid; gap: 3px; min-width: 0; }
    .menu-item__copy strong { overflow: hidden; font-size: 12px; font-weight: 800; text-overflow: ellipsis; white-space: nowrap; }
    .menu-item__copy span { overflow: hidden; color: #8a96aa; font-size: 10px; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
    .menu-item__chevron { width: 15px; height: 15px; fill: #a1acbd; }

    .menu-divider { height: 1px; margin: 4px 9px; background: rgba(27, 44, 78, .08); opacity: 0; transition: opacity 100ms ease; }
    .phone--menu-open .menu-divider { opacity: 1; transition-delay: 205ms; }

    .toast {
      position: absolute;
      z-index: 30;
      bottom: 39px;
      left: 50%;
      max-width: 260px;
      padding: 9px 12px;
      border: 1px solid rgba(255, 255, 255, .18);
      border-radius: 999px;
      color: #fff;
      background: rgba(18, 31, 59, .92);
      box-shadow: 0 8px 20px rgba(15, 25, 49, .20);
      font-size: 11px;
      font-weight: 750;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 10px) scale(.96);
      transition: opacity 180ms ease, transform 220ms var(--open-ease);
      white-space: nowrap;
    }

    .toast--visible { opacity: 1; transform: translate(-50%, 0) scale(1); }

    .motion-caption {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      margin-top: 17px;
      color: #8490a5;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .035em;
    }

    .motion-caption svg { width: 13px; height: 13px; fill: #6887ed; }

    @media (max-width: 900px) {
      .page { grid-template-columns: 1fr; justify-items: center; padding-top: 36px; }
      .brief { text-align: center; }
      .brief::before { left: 50%; transform: translateX(-50%); }
      .lede, h1 { margin-left: auto; margin-right: auto; }
      .motion-spec { margin-left: auto; margin-right: auto; text-align: left; }
    }

    @media (max-height: 920px) and (min-width: 901px) {
      .phone-viewport { height: 702px; }
      .phone { transform: scale(.86); transform-origin: top center; }
    }

    @media (max-width: 440px) {
      .page { gap: 22px; padding: 24px 12px 30px; }
      .brief { display: none; }
      .phone-viewport { width: 366px; height: 767px; }
      .phone { transform: scale(.938); transform-origin: top left; }
      .device-note { margin-bottom: 10px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="brief" aria-labelledby="preview-title">
      <p class="eyebrow">Nemo Motion Study</p>
      <h1 id="preview-title">右上角菜单，<br>从一个按钮自然长出来。</h1>
      <p class="lede">点击手机右上角图标。打开时由圆形锚点扩展为菜单卡片；关闭时按原路径收拢，不会有突兀的弹窗感。</p>

      <div class="motion-spec" aria-label="动画参数">
        <div class="motion-spec__item"><span class="motion-spec__label">Open</span><span class="motion-spec__value">350 ms</span></div>
        <div class="motion-spec__item"><span class="motion-spec__label">Close</span><span class="motion-spec__value">250 ms</span></div>
        <div class="motion-spec__item"><span class="motion-spec__label">Anchor</span><span class="motion-spec__value">Top end</span></div>
      </div>

      <button class="demo-button" id="replay-button" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6c-2.06 0-3.88-1.03-4.97-2.61l-1.44 1.44A7.97 7.97 0 0 0 12 21c4.42 0 8-3.58 8-8s-3.58-8-8-8Z"></path></svg>
        播放一次开关动画
      </button>
    </section>

    <section class="device-stage" aria-label="手机菜单动效预览">
      <div class="device-note"><span class="device-note__dot"></span>可交互原型 · 点击右上角</div>
      <div class="phone-viewport">
        <div class="phone" id="phone">
          <div class="phone-screen">
            <div class="dynamic-island" aria-hidden="true"></div>

            <div class="app-layer">
              <div class="status-bar" aria-hidden="true">
                <span>9:41</span>
                <div class="status-icons">

  <script>
    const phone = document.getElementById('phone');
    const trigger = document.getElementById('menu-trigger');
    const menu = document.getElementById('corner-menu');
    const scrim = document.getElementById('menu-scrim');
    const replayButton = document.getElementById('replay-button');
    const toast = document.getElementById('toast');
    const items = [...menu.querySelectorAll('.menu-item')];
    let toastTimer;
    let replayTimer;

    function setMenu(open, { returnFocus = false, focusFirst = false } = {}) {
      window.clearTimeout(replayTimer);
      phone.classList.toggle('phone--menu-open', open);
      trigger.setAttribute('aria-expanded', String(open));
      trigger.setAttribute('aria-label', open ? '关闭快捷菜单' : '打开快捷菜单');
      menu.setAttribute('aria-hidden', String(!open));
      menu.inert = !open;

      if (open && navigator.vibrate) navigator.vibrate(8);
      if (open && focusFirst) {
        window.setTimeout(() => items[0].focus(), 190);
      } else if (returnFocus) {
        trigger.focus();
      }
    }

    trigger.addEventListener('click', (event) => {
      const isOpen = phone.classList.contains('phone--menu-open');
      setMenu(!isOpen, { returnFocus: isOpen, focusFirst: event.detail === 0 });
    });

    scrim.addEventListener('click', () => setMenu(false, { returnFocus: true }));

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && phone.classList.contains('phone--menu-open')) {
        setMenu(false, { returnFocus: true });
      }
    });

    items.forEach((item) => {
      item.addEventListener('click', () => {
        const label = item.dataset.action;
        setMenu(false, { returnFocus: true });
        window.clearTimeout(toastTimer);
        toast.textContent = `已选择「${label}」`;
        toast.classList.add('toast--visible');
        toastTimer = window.setTimeout(() => toast.classList.remove('toast--visible'), 1600);
      });
    });

    replayButton.addEventListener('click', () => {
      setMenu(false);
      replayTimer = window.setTimeout(() => {
        setMenu(true);
        replayTimer = window.setTimeout(() => setMenu(false), 1450);
      }, 180);
    });
  </script>
