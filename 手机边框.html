<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nemo 学习成就海报 · 手机真机预览</title>
    <!-- 引入专业现代英数字体与 Google 字体 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Rubik:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            /* 页面背景与外部框架 */
            --bg-page: #e8ecf3;
            --phone-body: #1c1c22;
            --phone-bezel: #282832;
            --phone-shadow: rgba(15, 23, 42, 0.28);
            
            /* 浅色主题：纯白卡片 + 层次化弥散阴影系统 */
            --screen-bg: #eef2f7;
            --sheet-bg: #f5f7fb;
            --poster-bg: #f4f6fa;
            --poster-mesh: radial-gradient(circle at 85% 0%, rgba(14, 104, 255, 0.06) 0%, transparent 60%),
                            radial-gradient(circle at 10% 25%, rgba(255, 149, 0, 0.05) 0%, transparent 50%);
            
            /* 纯白卡片定义 */
            --bento-card-bg: #ffffff;
            --bento-card-border: rgba(226, 232, 240, 0.7);
            --bento-card-hover: #ffffff;
            --card-subtle-bg: #f8fafc;
            
            /* 高阶多层柔和弥散阴影 (Diffuse Ambient Shadows) */
            --shadow-diffuse-card: 0 10px 25px -4px rgba(22, 34, 56, 0.05),
                                   0 4px 10px -2px rgba(14, 104, 255, 0.03),
                                   0 1px 3px rgba(0, 0, 0, 0.02);
            --shadow-diffuse-highlight: 0 14px 30px -6px rgba(14, 104, 255, 0.09),
                                        0 6px 14px -3px rgba(0, 0, 0, 0.04);
            --shadow-poster: 0 20px 48px -12px rgba(15, 23, 42, 0.08), 
                             0 6px 18px -4px rgba(14, 104, 255, 0.04);
            --shadow-sm: 0 4px 12px -2px rgba(0, 0, 0, 0.03);
            
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --text-subtle: #cbd5e1;
            
            --brand-primary: #0E68FF;
            --brand-primary-light: rgba(14, 104, 255, 0.1);
            --brand-primary-glow: rgba(14, 104, 255, 0.28);
            
            --flame-orange: #FF6B00;
            --flame-amber: #FF9500;
            --flame-yellow: #FFCC00;
            --flame-glow: rgba(255, 107, 0, 0.2);
            
            --status-new: #EF4444;
            --status-learning: #3B82F6;
            --status-review: #10B981;
            --status-mastered: #8B5CF6;
            
            --btn-outline-border: #dbe0ea;
            --btn-outline-text: #334155;
            --btn-outline-bg: #ffffff;
            --heat-empty: #e2e8f0;
        }

        [data-theme="dark"] {
            --bg-page: #0b0c10;
            --phone-body: #0d0d12;
            --phone-bezel: #1e1e28;
            --phone-shadow: rgba(0, 0, 0, 0.6);
            
            /* 暗色主题：高级暗色卡片 + 环境发光弥散阴影 */
            --screen-bg: #0f1017;
            --sheet-bg: #141522;
            --poster-bg: #171827;
            --poster-mesh: radial-gradient(circle at 85% 0%, rgba(59, 130, 246, 0.12) 0%, transparent 60%),
                            radial-gradient(circle at 10% 25%, rgba(255, 149, 0, 0.08) 0%, transparent 50%);
            
            --bento-card-bg: #202136;
            --bento-card-border: rgba(255, 255, 255, 0.07);
            --bento-card-hover: #25263f;
            --card-subtle-bg: #1a1b2d;
            
            /* 暗色弥散阴影 */
            --shadow-diffuse-card: 0 12px 28px -4px rgba(0, 0, 0, 0.45),
                                   0 4px 10px -2px rgba(0, 0, 0, 0.3),
                                   0 0 0 1px rgba(255, 255, 255, 0.03);
            --shadow-diffuse-highlight: 0 14px 32px -6px rgba(59, 130, 246, 0.18),
                                        0 6px 14px -3px rgba(0, 0, 0, 0.4);
            --shadow-poster: 0 24px 50px -10px rgba(0, 0, 0, 0.65), 
                             0 0 0 1px rgba(255, 255, 255, 0.05);
            --shadow-sm: 0 4px 14px rgba(0, 0, 0, 0.3);
            
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --text-subtle: #334155;
            
            --brand-primary: #3b82f6;
            --brand-primary-light: rgba(59, 130, 246, 0.18);
            --brand-primary-glow: rgba(59, 130, 246, 0.35);
            
            --flame-orange: #FF7A1A;
            --flame-amber: #FFA11A;
            --flame-yellow: #FFD233;
            --flame-glow: rgba(255, 122, 26, 0.28);
            
            --btn-outline-border: #2a2b42;
            --btn-outline-text: #e2e8f0;
            --btn-outline-bg: #1c1d2e;
            --heat-empty: #24253a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: var(--bg-page);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 30px 16px;
            transition: background 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            color: var(--text-primary);
        }

        /* 顶部悬浮控制台 */
        .preview-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(24px);
            padding: 8px 14px;
            border-radius: 100px;
            box-shadow: 0 10px 30px -4px rgba(15, 23, 42, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.7);
            z-index: 200;
            transition: all 0.3s ease;
        }

        [data-theme="dark"] .preview-controls {
            background: rgba(26, 27, 43, 0.88);
            border-color: rgba(255, 255, 255, 0.08);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
        }

        .control-pill-group {
            display: flex;
            background: rgba(0, 0, 0, 0.05);
            padding: 3px;
            border-radius: 30px;
            gap: 2px;
        }

        [data-theme="dark"] .control-pill-group {
            background: rgba(255, 255, 255, 0.06);
        }

        .pill-btn {
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 11.5px;
            font-weight: 600;
            padding: 5px 12px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .pill-btn.active {
            background: var(--brand-primary);
            color: #ffffff;
            box-shadow: 0 3px 10px var(--brand-primary-glow);
        }

        .theme-toggle-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--bento-card-bg);
            color: var(--text-primary);
            border: 1px solid var(--bento-card-border);
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            transition: all 0.2s ease;
        }

        .theme-toggle-btn:hover {
            transform: translateY(-1px);
            border-color: var(--brand-primary);
        }

        /* 手机模型框架（iPhone 16 Pro 钛金属外观） */
        .phone-mockup-frame {
            position: relative;
            width: 396px;
            height: 844px;
            background: var(--phone-body);
            border-radius: 56px;
            padding: 10px;
            box-shadow: 
                0 0 0 2px var(--phone-bezel),
                0 0 0 4px rgba(255, 255, 255, 0.08) inset,
                0 32px 70px -10px var(--phone-shadow),
                0 12px 24px -5px rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: box-shadow 0.3s ease;
        }

        /* 手机屏幕本体 */
        .phone-inner-screen {
            position: relative;
            width: 100%;
            height: 100%;
            background: var(--screen-bg);
            border-radius: 48px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: background 0.3s ease;
        }

        /* 灵动岛 (Dynamic Island) */
        .dynamic-island-bar {
            position: absolute;
            top: 11px;
            left: 50%;
            transform: translateX(-50%);
            width: 112px;
            height: 29px;
            background: #000000;
            border-radius: 20px;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        }

        .island-lens {
            width: 11px;
            height: 11px;
            background: #0d0f18;
            border-radius: 50%;
            border: 1.5px solid #1a1e30;
            position: relative;
        }

        .island-lens::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 3px;
            height: 3px;
            background: rgba(59, 130, 246, 0.4);
            border-radius: 50%;
        }

        .island-face-sensor {
            width: 7.5px;
            height: 7.5px;
            background: #08090e;
            border-radius: 50%;
        }

        /* 顶部状态栏 */
        .native-status-bar {
            height: 48px;
            padding: 13px 26px 0 26px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13.5px;
            font-weight: 700;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--text-primary);
            z-index: 90;
        }

        .status-indicators {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .status-indicators svg {
            fill: var(--text-primary);
        }

        /* 抽屉弹窗主体 (NemoModalBottomSheet) */
        .sheet-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--sheet-bg);
            border-radius: 32px 32px 0 0;
            margin-top: 6px;
            padding: 8px 16px 14px 16px;
            overflow: hidden;
            box-shadow: 0 -12px 32px rgba(0, 0, 0, 0.06);
            transition: background 0.3s ease;
        }

        /* 抽屉顶部手柄 */
        .sheet-drag-handle {
            width: 38px;
            height: 4px;
            background: var(--text-muted);
            opacity: 0.35;
            border-radius: 3px;
            margin: 0 auto 10px auto;
        }

        /* 抽屉标题栏 */
        .sheet-nav-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding: 0 4px;
        }

        .sheet-nav-title {
            font-size: 15.5px;
            font-weight: 800;
            font-family: 'Plus Jakarta Sans', sans-serif;
            letter-spacing: -0.2px;
            color: var(--text-primary);
        }

        .sheet-nav-badge {
            font-size: 11px;
            font-weight: 600;
            padding: 3px 9px;
            background: var(--brand-primary-light);
            color: var(--brand-primary);
            border-radius: 12px;
        }

        /* 海报视口滚动区域 */
        .poster-viewport-area {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 4px 4px 12px 4px;
            display: flex;
            justify-content: center;
            scrollbar-width: none;
        }

        .poster-viewport-area::-webkit-scrollbar {
            display: none;
        }

        /* ═════════════════════════════════════════════
           海报主体卡片 (Poster Main Card)
           ═════════════════════════════════════════════ */
        .poster-card {
            width: 100%;
            background: var(--poster-bg);
            background-image: var(--poster-mesh);
            border-radius: 26px;
            padding: 20px 18px 18px 18px;
            box-shadow: var(--shadow-poster);
            border: 1px solid var(--bento-card-border);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        /* 1. 顶部身份品牌行 */
        .brand-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .brand-identity {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-logo-gem {
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, #0E68FF, #3B82F6);
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px var(--brand-primary-glow);
        }

        .brand-logo-gem svg {
            width: 14px;
            height: 14px;
            fill: #ffffff;
        }

        .brand-titles {
            display: flex;
            flex-direction: column;
        }

        .brand-name {
            font-size: 13.5px;
            font-weight: 800;
            letter-spacing: -0.3px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .brand-name-tag {
            font-size: 9.5px;
            font-weight: 700;
            color: var(--brand-primary);
            background: var(--brand-primary-light);
            padding: 1px 5px;
            border-radius: 4px;
            letter-spacing: 0;
        }

        .poster-timestamp {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        /* 2. 核心 Hero 区 (Streak Spotlight) */
        .hero-streak-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px 10px 18px 10px;
            margin-bottom: 12px;
            position: relative;
        }

        .flame-halo-container {
            position: relative;
            margin-bottom: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .flame-halo-bg {
            position: absolute;
            width: 76px;
            height: 76px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--flame-glow) 0%, rgba(255, 149, 0, 0.02) 70%, transparent 100%);
            animation: pulseGlow 3s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: scale(0.92); opacity: 0.7; }
            100% { transform: scale(1.18); opacity: 1; }
        }

        .flame-icon-pod {
            position: relative;
            width: 54px;
            height: 54px;
            border-radius: 18px;
            background: var(--bento-card-bg);
            border: 1px solid rgba(255, 149, 0, 0.25);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 24px -2px var(--flame-glow), var(--shadow-sm);
        }

        .flame-icon-pod svg {
            width: 32px;
            height: 32px;
            fill: url(#flameGrad);
        }

        .streak-count-hero {
            font-family: 'Rubik', sans-serif;
            font-size: 54px;
            font-weight: 900;
            line-height: 0.95;
            letter-spacing: -1.5px;
            background: linear-gradient(180deg, var(--text-primary) 35%, var(--text-secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
        }

        .streak-unit-label {
            font-size: 13.5px;
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: 6px;
            letter-spacing: -0.1px;
        }

        .streak-honor-pill {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 11px;
            background: var(--bento-card-bg);
            border: 1px solid var(--bento-card-border);
            border-radius: 20px;
            font-size: 10.5px;
            font-weight: 600;
            color: var(--text-secondary);
            box-shadow: var(--shadow-sm);
        }

        .honor-star-icon {
            width: 12px;
            height: 12px;
            fill: var(--flame-amber);
        }

        /* 3. 纯白 Bento 网格体系 + 柔和弥散阴影 */
        .bento-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 11px;
            margin-bottom: 12px;
        }

        .bento-card {
            background: var(--bento-card-bg);
            border: 1px solid var(--bento-card-border);
            border-radius: 19px;
            padding: 14px 13px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            box-shadow: var(--shadow-diffuse-card);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .bento-card:hover {
            transform: translateY(-1px);
            box-shadow: 0 14px 28px -4px rgba(22, 34, 56, 0.08), 0 4px 12px -2px rgba(14, 104, 255, 0.04);
        }

        /* 今日战报卡片（全宽主打高亮纯白） */
        .bento-card-highlight {
            grid-column: span 2;
            background: var(--bento-card-bg);
            padding: 14px 15px;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            border-left: 4px solid var(--brand-primary);
            box-shadow: var(--shadow-diffuse-highlight);
        }

        .bento-highlight-left {
            display: flex;
            align-items: center;
            gap: 11px;
        }

        .bento-highlight-info {
            display: flex;
            flex-direction: column;
        }

        .bento-highlight-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 2px;
        }

        .bento-highlight-value-row {
            display: flex;
            align-items: baseline;
            gap: 3px;
        }

        .bento-highlight-number {
            font-family: 'Rubik', sans-serif;
            font-size: 25px;
            font-weight: 800;
            color: var(--text-primary);
            line-height: 1;
        }

        .bento-highlight-unit {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .bento-highlight-tag {
            font-size: 10.5px;
            font-weight: 700;
            color: #10b981;
            background: rgba(16, 185, 129, 0.1);
            padding: 5px 9px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 3px;
        }

        /* 普通半宽 Bento 卡片 */
        .bento-card-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 9px;
        }

        .bento-icon-box {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bento-icon-box svg {
            width: 18px;
            height: 18px;
        }

        .bento-sub-pill {
            font-size: 9.5px;
            font-weight: 700;
            padding: 2.5px 7px;
            border-radius: 6px;
        }

        .bento-card-body {
            display: flex;
            flex-direction: column;
        }

        .bento-metric-row {
            display: flex;
            align-items: baseline;
            gap: 2px;
            margin-bottom: 2px;
        }

        .bento-metric-number {
            font-family: 'Rubik', sans-serif;
            font-size: 22px;
            font-weight: 800;
            color: var(--text-primary);
            line-height: 1;
        }

        .bento-metric-unit {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .bento-metric-title {
            font-size: 11.5px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        /* 4. 纯白记忆全景卡片 (Memory Panorama FSRS) */
        .panorama-bento-card {
            background: var(--bento-card-bg);
            border: 1px solid var(--bento-card-border);
            border-radius: 19px;
            padding: 15px 14px 13px 14px;
            margin-bottom: 12px;
            box-shadow: var(--shadow-diffuse-card);
        }

        .panorama-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 11px;
        }

        .panorama-title-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .panorama-title-icon {
            width: 16px;
            height: 16px;
            fill: var(--brand-primary);
        }

        .panorama-main-title {
            font-size: 12.5px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .panorama-total-pill {
            font-size: 11px;
            font-weight: 700;
            font-family: 'Rubik', sans-serif;
            color: var(--text-secondary);
            background: var(--card-subtle-bg);
            padding: 2px 8px;
            border-radius: 6px;
            border: 1px solid var(--bento-card-border);
        }

        /* 胶囊分段进度条 */
        .segmented-progress-track {
            width: 100%;
            height: 9px;
            background: var(--heat-empty);
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            margin-bottom: 11px;
        }

        .progress-bar-seg {
            height: 100%;
            transition: width 0.4s ease;
        }

        /* 四阶段指标行 */
        .panorama-stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
        }

        .stage-stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 5px 0;
            background: var(--card-subtle-bg);
            border-radius: 9px;
            border: 1px solid rgba(0, 0, 0, 0.02);
        }

        [data-theme="dark"] .stage-stat-item {
            border-color: rgba(255, 255, 255, 0.04);
        }

        .stage-badge-dot {
            width: 6.5px;
            height: 6.5px;
            border-radius: 50%;
            margin-bottom: 3px;
        }

    <script>
        // 1. 初始化微缩热力图点阵 (12 周 x 7 天)
        function renderMicroHeatmap() {
            const container = document.getElementById('heat-matrix-container');
            if (!container) return;
            container.innerHTML = '';

            const pattern = [
                [0, 1, 0, 2, 1, 0, 2],
                [1, 2, 1, 0, 2, 3, 1],
                [0, 2, 3, 1, 2, 0, 2],
                [1, 1, 2, 3, 2, 1, 3],
                [2, 3, 2, 1, 3, 2, 2],
                [1, 2, 3, 4, 3, 2, 3],
                [2, 3, 3, 2, 4, 3, 2],
                [3, 2, 4, 3, 3, 4, 3],
                [2, 4, 3, 4, 4, 3, 4],
                [3, 4, 4, 3, 4, 4, 3],
                [4, 3, 4, 4, 4, 4, 4],
                [4, 4, 4, 4, 4, 4, 4]
            ];

            pattern.forEach(col => {
                const colEl = document.createElement('div');
                colEl.className = 'heat-cell-col';
                col.forEach(level => {
                    const dot = document.createElement('div');
                    dot.className = 'heat-cell-dot' + (level > 0 ? ` heat-lv-${level}` : '');
                    colEl.appendChild(dot);
                });
                container.appendChild(colEl);
            });
        }

        // 2. 主题切换
        function toggleTheme() {
            const html = document.documentElement;
            const current = html.getAttribute('data-theme');
            const newTheme = current === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            
            document.getElementById('theme-btn-text').textContent = newTheme === 'dark' ? '浅色模式' : '暗色模式';
        }

        // 3. 版式切换
        function setLayout(mode) {
            const bentoBtn = document.getElementById('btn-layout-bento');
            const proBtn = document.getElementById('btn-layout-pro');
            const heatSection = document.getElementById('pro-heatmap-section');

            if (mode === 'bento') {
                bentoBtn.classList.add('active');
                proBtn.classList.remove('active');
                heatSection.style.display = 'none';
            } else {
                proBtn.classList.add('active');
                bentoBtn.classList.remove('active');
                heatSection.style.display = 'flex';
            }
        }

        // 4. 模拟操作反馈
        function triggerMockSave() {
            const btn = document.querySelector('.btn-save-image span');
            const orig = btn.textContent;
            btn.textContent = '已保存到相册 ✓';
            setTimeout(() => { btn.textContent = orig; }, 1500);
        }

        function triggerMockShare() {
            const btn = document.querySelector('.btn-share-card span');
            const orig = btn.textContent;
            btn.textContent = '已调起系统分享...';
            setTimeout(() => { btn.textContent = orig; }, 1500);
        }

        // 启动执行
        document.addEventListener('DOMContentLoaded', () => {
            renderMicroHeatmap();
            setLayout('pro');
        });
    </script>
</body>
</html>
